<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1721">
  <title>KPI Detective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand" aria-label="KPI Detective">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M20 20l8 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M8.5 16.5v-3M12.5 16.5v-6M16.5 16.5v-4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">KPI Detective</span>
      </div>
      <div class="status" id="status" hidden>
        <span class="status-stage" id="statusStage"></span>
        <span class="status-score">Ideas <strong id="statusScore">0</strong> de <span id="statusTotal">0</span></span>
      </div>
      <button type="button" class="btn ghost small" id="guideBtn">Guía KPI</button>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-label="Progreso del juego" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <dialog id="guideDialog" class="dialog" aria-labelledby="guideTitle"></dialog>
  <dialog id="cardDialog" class="dialog" aria-labelledby="cardTitle"></dialog>

  <noscript><p class="noscript">Este juego necesita JavaScript para funcionar. Actívalo en tu navegador e inténtalo de nuevo.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/vendor/pdf-lib.min.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
