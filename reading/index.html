<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Reading | Proff Toolbox</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #b6c4d8;
      --accent-color: #60a5fa;
      --border-color: #3b4b63;
      --reading-accent: #22c1a1;
      --reading-soft: rgba(34, 193, 161, 0.12);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 1.35rem 2rem;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .breadcrumb {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .breadcrumb a:hover { color: var(--accent-color); }

    .page-hero {
      max-width: 850px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2.5rem;
      text-align: center;
    }

    .eyebrow {
      display: block;
      margin-bottom: 1rem;
      color: var(--reading-accent);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .page-hero h1 {
      margin-bottom: 1rem;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }

    .page-hero p {
      max-width: 580px;
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .section {
      width: min(800px, 100%);
      margin: 0 auto;
      padding: 0.5rem 1.5rem 5rem;
    }

    /* ===== Search + Filter bar ===== */
    .filter-bar {
      position: relative;
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
      pointer-events: none;
    }

    .filter-bar input {
      width: 100%;
      padding: 0.95rem 1.1rem 0.95rem 2.7rem;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-bar input:focus {
      border-color: var(--reading-accent);
    }

    .filter-bar input::placeholder {
      color: var(--text-secondary);
    }

    /* Filter button */
    .filter-btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--reading-accent);
      color: var(--reading-accent);
    }

    .filter-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    /* Filter dropdown */
    .filter-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 180px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.4rem;
      z-index: 20;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .filter-menu.open {
      display: block;
    }

    .filter-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.7rem 0.9rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }

    .filter-menu button:hover {
      background: rgba(255,255,255,0.06);
    }

    .filter-menu button.active {
      color: var(--reading-accent);
      font-weight: 600;
    }

    /* ===== Reading list ===== */
    .reading-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .reading-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.4rem;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .reading-item:hover {
      transform: translateY(-2px);
      border-color: var(--reading-accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .reading-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .file-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .file-icon.pdf { color: #f87171; }
    .file-icon.html { color: #60a5fa; }

    .reading-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .reading-type {
      margin-top: 0.15rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .open-arrow {
      color: var(--text-secondary);
      font-size: 1.25rem;
      transition: color 0.2s ease;
    }

    .reading-item:hover .open-arrow {
      color: var(--reading-accent);
    }

    .back-link {
      display: inline-block;
      margin-top: 2.5rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .back-link:hover { color: var(--accent-color); }

    @media (max-width: 700px) {
      body { font-size: 16px; }
      .site-header { padding: 1.1rem 1.25rem; }
      .breadcrumb { padding: 0 1.25rem 1.2rem; }
      .page-hero { padding: 2.5rem 1.25rem 2rem; }
      .page-hero h1 { font-size: clamp(1.9rem, 8vw, 2.6rem); }
      .section { padding: 0.5rem 1.15rem 4rem; }
      .reading-item { padding: 1.1rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">Proff Toolbox</a>
  </header>

  <div class="breadcrumb">
    <a href="../index.html">Home</a> / Reading
  </div>

  <main>
    <section class="page-hero">
      <span class="eyebrow">READ & DISCOVER</span>
      <h1>Reading</h1>
      <p>Explore texts, business cases and reading activities.</p>
    </section>

    <section class="section">
      <!-- Search + Filter -->
      <div class="filter-bar">
        <div class="search-wrap">
          <!-- Magnifying glass icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search readings..."
            aria-label="Search readings"
          >
        </div>

        <!-- Filter button -->
        <button class="filter-btn" id="filterBtn" aria-label="Filter options" title="Filter">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
            <line x1="11" y1="18" x2="13" y2="18"></line>
          </svg>
        </button>

        <!-- Filter menu -->
        <div class="filter-menu" id="filterMenu">
          <button data-filter="all" class="active">All files</button>
          <button data-filter="pdf">PDF only</button>
          <button data-filter="html">HTML only</button>
          <button data-filter="az">Sort A–Z</button>
        </div>
      </div>

      <!-- Reading list -->
      <div class="reading-list" id="readingList">
        <a href="./PDF/The history of humankind.pdf" target="_blank" rel="noopener" class="reading-item" data-type="pdf">
          <div class="reading-info">
            <div class="file-icon pdf">PDF</div>
            <div>
              <div class="reading-title">The history of humankind</div>
              <div class="reading-type">Document · PDF</div>
            </div>
          </div>
          <div class="open-arrow">→</div>
        </a>

        <a href="./HTML/The history of universe.html" target="_blank" rel="noopener" class="reading-item" data-type="html">
          <div class="reading-info">
            <div class="file-icon html">HTML</div>
            <div>
              <div class="reading-title">The history of universe</div>
              <div class="reading-type">Interactive · HTML</div>
            </div>
          </div>
          <div class="open-arrow">→</div>
        </a>

        <a href="./PDF/The new age of technology.pdf" target="_blank" rel="noopener" class="reading-item" data-type="pdf">
          <div class="reading-info">
            <div class="file-icon pdf">PDF</div>
            <div>
              <div class="reading-title">The new age of technology</div>
              <div class="reading-type">Document · PDF</div>
            </div>
          </div>
          <div class="open-arrow">→</div>
        </a>
      </div>

      <a class="back-link" href="../index.html">← Back to home</a>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const filterBtn = document.getElementById('filterBtn');
      const filterMenu = document.getElementById('filterMenu');
      const list = document.getElementById('readingList');
      let currentFilter = 'all';
      let sortAZ = false;

      // Toggle filter menu
      filterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        filterMenu.classList.toggle('open');
        filterBtn.classList.toggle('active');
      });

      // Close menu when clicking outside
      document.addEventListener('click', () => {
        filterMenu.classList.remove('open');
        filterBtn.classList.remove('active');
      });

      filterMenu.addEventListener('click', (e) => e.stopPropagation());

      // Filter buttons
      filterMenu.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = btn.dataset.filter;

          // Update active state
          filterMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          if (value === 'az') {
            sortAZ = true;
          } else {
            currentFilter = value;
            sortAZ = false;
          }

          applyFilters();
          filterMenu.classList.remove('open');
          filterBtn.classList.remove('active');
        });
      });

      // Search
      searchInput.addEventListener('input', applyFilters);

      function applyFilters() {
        const query = searchInput.value.toLowerCase().trim();
        const items = Array.from(list.querySelectorAll('.reading-item'));

        // Filter
        items.forEach(item => {
          const title = item.querySelector('.reading-title').textContent.toLowerCase();
          const type = item.dataset.type;
          const matchesSearch = title.includes(query);
          const matchesType = currentFilter === 'all' || type === currentFilter;
          item.style.display = (matchesSearch && matchesType) ? 'flex' : 'none';
        });

        // Sort A-Z if requested
        if (sortAZ) {
          items.sort((a, b) => {
            const ta = a.querySelector('.reading-title').textContent.toLowerCase();
            const tb = b.querySelector('.reading-title').textContent.toLowerCase();
            return ta.localeCompare(tb);
          });
          items.forEach(item => list.appendChild(item));
        }
      }
    });
  </script>
</body>
</html>
